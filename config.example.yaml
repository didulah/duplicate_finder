database:
  type: mysql          # "mysql" hoo "postgresql"
  host: localhost
  port: 3306            # MySQL: 3306, PostgreSQL: 5432
  user: your_db_user
  password: your_db_password
  database: your_database_name

scan:
  table: customers               # scan karanna oona table eka
  match_columns:                 # duplicate check karanna column(s)
    - email
  primary_key: id                # table eke primary key column eka
  keep_strategy: keep_first      # keep_first | keep_latest

output:
  format: csv                    # csv | json
  directory: ./reports

safety:
  auto_backup_before_delete: true
  backup_directory: ./backups
  