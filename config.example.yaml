# ============================================================
# Duplicate Finder - Configuration File (Example)
# ============================================================
# Copy this file and save it as "config.yaml".
# Put your real credentials only in config.yaml (never push it to git).

database:
  # type: "mysql" or "postgresql"
  type: "mysql"
  host: "localhost"
  port: 3306          # MySQL default: 3306, PostgreSQL default: 5432
  user: "your_db_user"
  password: "your_db_password"
  database: "your_database_name"

# ------------------------------------------------------------
# Scan Settings - which table and which columns to check for duplicates
# ------------------------------------------------------------
scan:
  table: "customers"

  # Columns to check for duplicates (you can provide more than one)
  # Example: to check by email only -> ["email"]
  #          to check by email + phone -> ["email", "phone"]
  match_columns:
    - "email"

  # Primary key column name (used to identify each record)
  primary_key: "id"

  # How to choose which record to "keep" within a duplicate group
  # options: "keep_first" (lowest primary key), "keep_latest" (highest primary key)
  keep_strategy: "keep_first"

# ------------------------------------------------------------
# Output Settings
# ------------------------------------------------------------
output:
  format: "csv"          # "csv" or "json"
  directory: "./reports"

# ------------------------------------------------------------
# Safety Settings
# ------------------------------------------------------------
safety:
  auto_backup_before_delete: true
  backup_directory: "./backups"
