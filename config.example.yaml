# ============================================================
# Duplicate Finder - Configuration File (Example)
# ============================================================
# මේ file එක copy කරලා "config.yaml" විදිහට save කරන්න.
# real credentials දාන්නෙ config.yaml එකේ විතරයි (git වලට push කරන්න එපා).

database:
  # type: "mysql" or "postgresql"
  type: "mysql"
  host: "localhost"
  port: 3306          # MySQL default: 3306, PostgreSQL default: 5432
  user: "your_db_user"
  password: "your_db_password"
  database: "your_database_name"

# ------------------------------------------------------------
# Scan Settings - මොන table එකේ, මොන columns වල duplicates check කරන්නද
# ------------------------------------------------------------
scan:
  table: "customers"

  # Duplicate check කරන columns (එකකට වඩා දෙන්නත් පුළුවන්)
  # උදා: email එකකින් විතරක් check කරනවා නම් ["email"]
  #      email + phone දෙකෙන්ම check කරනවා නම් ["email", "phone"]
  match_columns:
    - "email"

  # Primary key column name (record identify කරන්න ඕන)
  primary_key: "id"

  # Duplicate group එකකින් "keep" කරන record එක තෝරගන්නෙ කොහොමද
  # options: "keep_first" (lowest primary key), "keep_latest" (highest primary key)
  keep_strategy: "keep_first"

# ------------------------------------------------------------
# Output Settings
# ------------------------------------------------------------
output:
  format: "csv"          # "csv" හෝ "json"
  directory: "./reports"

# ------------------------------------------------------------
# Safety Settings
# ------------------------------------------------------------
safety:
  auto_backup_before_delete: true
  backup_directory: "./backups"
